<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transmitter</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
      margin: 0; padding: 14px; background: #121212; color: #eee; max-width: 640px;
    }
    h1 { font-size: 1.15rem; margin: 0 0 10px; }
    .grid { display: grid; grid-template-columns: max-content 1fr; gap: 8px 12px; align-items: center; margin-bottom: 12px; }
    label { font-size: 0.9rem; color: #ccc; }
    input, select { padding: 6px 8px; border-radius: 6px; border: 1px solid #555; background: #1e1e1e; color: #eee; font-size: 0.9rem; width: 100%; }
    input[type=file] { border: none; padding: 4px 0; }
    button {
      padding: 9px 16px; font-size: 0.95rem; border-radius: 6px; border: 1px solid #2563eb;
      background: #2563eb; color: #fff; cursor: pointer; margin-right: 8px;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    button.success { background: #16a34a; border-color: #16a34a; }
    .bar { width: 100%; height: 14px; background: #2a2a2a; border-radius: 7px; overflow: hidden; margin: 10px 0 6px; }
    .bar > div { height: 100%; width: 0; background: #16a34a; transition: width 100ms linear; }
    #status { font-size: 0.9rem; min-height: 1.2em; }
    .meta { font-size: 0.8rem; color: #aaa; white-space: pre-wrap; }
    .hint { font-size: 0.8rem; color: #999; margin-top: 10px; }
    a#dl { display: inline-block; margin-top: 10px; color: #4ade80; }
  </style>
</head>
<body>
  <h1>Transmitter</h1>

  <div class="grid">
    <label>ファイル</label><input type="file" id="file">
    <label>1フレームbyte</label><input type="number" id="frameBytes" value="1465" min="60" max="2900">
    <label>fps</label><input type="number" id="fps" value="12" min="1" max="30">
    <label>冗長度 (×K)</label><input type="number" id="redundancy" value="2.5" min="1" max="10" step="0.1">
    <label>QR幅(px)</label><input type="number" id="width" value="720" min="240" max="1600">
    <label>誤り訂正</label>
    <select id="ecc"><option>L</option><option>M</option><option>Q</option><option>H</option></select>
  </div>

  <button id="genBtn" disabled>動画を生成</button>
  <a id="dl" style="display:none"></a>

  <div class="bar"><div id="barFill"></div></div>
  <div id="status">ファイルを選択してください</div>
  <div class="meta" id="meta"></div>

  <p class="hint">
    PCのChrome / Edge（デスクトップ）で動作します（WebCodecs必須）。
  </p>

  <!-- vendored libs（オフライン動作のためCDNではなく埋め込み。build-send.mjs が中身を注入） -->

    }
    class LTEncoder {
      constructor(payload, blockLen, sessionId) {
        this.blockLen = blockLen; this.sessionId = sessionId;
        this.k = Math.max(1, Math.ceil(payload.length / blockLen));
        this.words = Math.ceil(blockLen / 4);
        this.blocks = new Uint32Array(this.k * this.words);
        const bytes = new Uint8Array(this.blocks.buffer);
        for (let b = 0; b < this.k; b++) {
          const src = payload.subarray(b * blockLen, Math.min((b + 1) * blockLen, payload.length));
          bytes.set(src, b * this.words * 4);
        }
        this.cdf = solitonCdf(this.k);
      }
      encode(seq) {
        const idx = frameIndices(this.k, this.cdf, this.sessionId, seq);
        const out = new Uint32Array(this.words);
        for (const b of idx) {
          const off = b * this.words;
          for (let w = 0; w < this.words; w++) out[w] = (out[w] ^ this.blocks[off + w]) >>> 0;
        }
        return new Uint8Array(out.buffer, 0, this.blockLen);
      }
    }
    function wrapFile(name, fileBytes) {
      const nameBytes = new TextEncoder().encode(name);
      const out = new Uint8Array(3 + nameBytes.length + fileBytes.length);
      const dv = new DataView(out.buffer);
      dv.setUint8(0, 1); dv.setUint16(1, nameBytes.length, true);
      out.set(nameBytes, 3); out.set(fileBytes, 3 + nameBytes.length);
      return out;
    }

    // ===================================================================
    // アプリ本体
    // ===================================================================
    const $ = (id) => document.getElementById(id);
    const fileEl = $("file"), genBtn = $("genBtn"), dlEl = $("dl");
    const barFill = $("barFill"), statusEl = $("status"), metaEl = $("meta");
    let picked = null;

    fileEl.addEventListener("change", () => {
      picked = fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
      genBtn.disabled = !picked;
      dlEl.style.display = "none";
      statusEl.textContent = picked ? `選択: ${picked.name} (${(picked.size / 1024).toFixed(1)} KB)` : "ファイルを選択してください";
      metaEl.textContent = "";
      barFill.style.width = "0";
    });

    const MASK_PATTERN = 4;
    function makeQrImageData(bytes, ecc, version, margin) {
      const qr = qrCreate([{ data: Array.from(bytes), mode: "byte" }], {
        errorCorrectionLevel: ecc, version, maskPattern: MASK_PATTERN,
      });
      const size = qr.modules.size, data = qr.modules.data;
      const total = size + 2 * margin;
      const img = new ImageData(total, total);
      const px = new Uint32Array(img.data.buffer);
      px.fill(0xffffffff);
      for (let y = 0; y < size; y++) {
        const row = (y + margin) * total + margin, src = y * size;
        for (let x = 0; x < size; x++) if (data[src + x]) px[row + x] = 0xff000000;
      }
      return { img, total, version: qr.version, size };
    }

    async function generate() {
      if (!picked) return;
      if (!("VideoEncoder" in window)) {
        statusEl.textContent = "✗ このブラウザはWebCodecsに非対応です（PCのChrome/Edgeで開いてください）";
        return;
      }
      genBtn.disabled = true; dlEl.style.display = "none";
      const outName = picked.name.replace(/\.[^.]+$/, "") + ".mp4";
      // 大きい出力はメモリに載らない → 可能ならファイルへ直接ストリーム(Chrome/Edge)。
      // ユーザー操作直後に呼ぶ必要があるため、重い処理の前にここで確保する。
      const canStream = typeof window.showSaveFilePicker === "function";
      let writable = null;
      if (canStream) {
        try {
          const fh = await window.showSaveFilePicker({
            suggestedName: outName,
            types: [{ description: "MP4 video", accept: { "video/mp4": [".mp4"] } }],
          });
          writable = await fh.createWritable();
        } catch (e) {
          if (e && e.name === "AbortError") { statusEl.textContent = "キャンセルしました"; genBtn.disabled = false; return; }
          writable = null; // ピッカー不可→メモリ版へフォールバック
        }
      }
      const ecc = $("ecc").value;
      const fps = Number($("fps").value);
      const frameBytes = Number($("frameBytes").value);
      const redundancy = Number($("redundancy").value);
      const width = Number($("width").value);
      const margin = 4;

      const fileBytes = new Uint8Array(await picked.arrayBuffer());
      const payload = wrapFile(picked.name, fileBytes);
      const blockLen = frameBytes - HEADER_LEN;
      const sessionId = (Math.floor(Math.random() * 0xffff) + 1) & 0xffff;
      const enc = new LTEncoder(payload, blockLen, sessionId);
      const header = {
        sessionId, seq: 0, k: enc.k, blockLen,
        totalLen: payload.length, payloadFnv: fnv1a(payload),
      };
      const M = Math.ceil(enc.k * redundancy);

      // 先頭フレームで版・寸法を確定
      let first;
      try {
        first = makeQrImageData(packFrame({ ...header, seq: 0 }, enc.encode(0)), ecc, undefined, margin);
      } catch (e) {
        statusEl.textContent = `✗ QR生成失敗（1フレームbyteがECC ${ecc}の容量超過かも）: ${e.message}`;
        genBtn.disabled = false; return;
      }
      const version = first.version;
      const total = first.total;
      const scale = Math.max(1, Math.floor(width / total));
      const px = total * scale;
      const cw = px + (px & 1); // H.264はyuv420で偶数寸法必須

      // 描画キャンバス
      const staging = document.createElement("canvas");
      staging.width = total; staging.height = total;
      const sctx = staging.getContext("2d");
      const out = document.createElement("canvas");
      out.width = cw; out.height = cw;
      const octx = out.getContext("2d");
      octx.imageSmoothingEnabled = false;

      // エンコーダ設定（iOS再生のため avc/baseline系を優先）
      const target = writable
        ? new FileSystemWritableFileStreamTarget(writable)
        : new ArrayBufferTarget();
      const muxer = new Muxer({
        target,
        video: { codec: "avc", width: cw, height: cw },
        fastStart: writable ? false : "in-memory", // 直書き時はmoov末尾でメモリ平坦
      });
      const candidates = ["avc1.420028", "avc1.4d0028", "avc1.640028"];
      const bitrate = Math.min(24_000_000, Math.round(cw * cw * fps * 0.25));
      let codec = null;
      for (const c of candidates) {
        try {
          const s = await VideoEncoder.isConfigSupported({ codec: c, width: cw, height: cw, framerate: fps, bitrate });
          if (s.supported) { codec = c; break; }
        } catch {}
      }
      if (!codec) {
        statusEl.textContent = "✗ このブラウザはH.264エンコードに非対応（PCのChrome/Edgeを推奨）";
        genBtn.disabled = false; return;
      }

      const encoder = new VideoEncoder({
        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
        error: (e) => { statusEl.textContent = "✗ エンコードエラー: " + e.message; },
      });
      encoder.configure({ codec, width: cw, height: cw, framerate: fps, bitrate, latencyMode: "quality" });

      const estSec = M / fps;
      const estMB = (bitrate / 8) * estSec / 1e6;
      statusEl.textContent = "生成中…";
      metaEl.textContent =
        `K=${enc.k} / frameBytes=${frameBytes} / QR V${version} ECC ${ecc}\n` +
        `フレーム M=${M} (冗長 ${(M / enc.k).toFixed(2)}x) / ${fps}fps / ${cw}px / ${codec} / sessionId=${sessionId}\n` +
        `推定: 長さ ${estSec.toFixed(0)}s / サイズ ~${estMB.toFixed(0)}MB / 出力 ${writable ? "ファイル直書き" : "メモリ"}`;
      if (!writable && estMB > 400) {
        statusEl.textContent =
          `⚠ 推定 ~${estMB.toFixed(0)}MB。メモリ確保に失敗する場合はChrome/Edgeで開く（ファイル直書き）` +
          `か、1フレームbyteを上げ・冗長度を下げてください。続行します…`;
      }

      const t0 = performance.now();
      const usPerFrame = 1e6 / fps;
      for (let seq = 0; seq < M; seq++) {
        const q = seq === 0 ? first : makeQrImageData(packFrame({ ...header, seq }, enc.encode(seq)), ecc, version, margin);
        sctx.putImageData(q.img, 0, 0);
        octx.fillStyle = "#fff"; octx.fillRect(0, 0, cw, cw);
        octx.drawImage(staging, 0, 0, total, total, 0, 0, px, px);
        const frame = new VideoFrame(out, { timestamp: Math.round(seq * usPerFrame), duration: Math.round(usPerFrame) });
        // 全フレームをキーフレーム（QRは互いに無相関なのでオールイントラが最適）
        encoder.encode(frame, { keyFrame: true });
        frame.close();
        // バックプレッシャ: エンコードキューが詰まったら待つ
        while (encoder.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 0));
        if ((seq + 1) % 5 === 0 || seq + 1 === M) {
          barFill.style.width = (((seq + 1) / M) * 100).toFixed(1) + "%";
          statusEl.textContent = `生成中… ${seq + 1}/${M}`;
          await new Promise((r) => requestAnimationFrame(r));
        }
      }
      await encoder.flush();
      muxer.finalize();
      const dt = (performance.now() - t0) / 1000;

      if (writable) {
        await writable.close(); // ディスクへ確定
        dlEl.style.display = "none";
        statusEl.textContent = `完了 (${dt.toFixed(1)}s)。${outName} に保存しました。`;
      } else {
        const blob = new Blob([muxer.target.buffer], { type: "video/mp4" });
        const url = URL.createObjectURL(blob);
        dlEl.href = url; dlEl.download = outName;
        dlEl.textContent = `⬇ ${outName} を保存 (${(blob.size / 1024 / 1024).toFixed(2)} MB)`;
        dlEl.style.display = "inline-block";
        statusEl.textContent = `完了 (${dt.toFixed(1)}s)。下のリンクから保存してください。`;
      }
      barFill.style.width = "100%";
      genBtn.disabled = false;
    }

    genBtn.addEventListener("click", () => { generate().catch((e) => { statusEl.textContent = "✗ " + e.message; genBtn.disabled = false; }); });
  </script>
</body>
</html>
