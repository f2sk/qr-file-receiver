<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>QRファイル受信 (fountain)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
      margin: 0; padding: 10px; background: #121212; color: #eee;
    }
    h1 { font-size: 1.1rem; margin: 0 0 8px; }
    .row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    button {
      padding: 8px 12px; font-size: 0.95rem; border-radius: 6px;
      border: 1px solid #555; background: #2a2a2a; color: #eee; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    button.success { background: #16a34a; border-color: #16a34a; color: #fff; }
    .cam-wrap { position: relative; width: 100%; max-width: 480px; margin: 0 0 10px; }
    #video { width: 100%; background: #000; border-radius: 8px; display: block; }
    #indicator {
      display: inline-block; width: 18px; height: 18px; background: #c33;
      border-radius: 4px; transition: background 80ms ease-out;
    }
    #indicator.blink { background: #4ade80; }
    #status { font-size: 0.9rem; }
    #engine { font-size: 0.75rem; color: #888; margin-left: auto; }
    .bar { width: 100%; max-width: 480px; height: 14px; background: #2a2a2a;
      border-radius: 7px; overflow: hidden; margin-bottom: 6px; }
    .bar > div { height: 100%; width: 0; background: #16a34a; transition: width 120ms linear; }
    .meta { font-size: 0.8rem; color: #aaa; }
    canvas#work { display: none; }
    .hint { font-size: 0.8rem; color: #999; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>QRファイル受信 (fountain)</h1>

  <div class="row">
    <button id="startBtn" class="primary">スキャン開始</button>
    <button id="stopBtn" disabled>停止</button>
    <button id="resetBtn">リセット</button>
    <button id="saveBtn" class="success" disabled>保存</button>
  </div>

  <div class="row">
    <span id="indicator" aria-label="認識インジケーター"></span>
    <span id="status">デコーダ準備中…</span>
    <span id="engine">[zxing-wasm]</span>
  </div>

  <div class="bar"><div id="barFill"></div></div>
  <div class="meta" id="meta"></div>

  <div class="cam-wrap">
    <video id="video" playsinline muted autoplay></video>
  </div>
  <canvas id="work"></canvas>
  <p class="hint">QR動画をカメラに向けてください。fountain符号なので、読めないフレームがあっても十分な枚数が集まれば復元できます。</p>
  <p class="hint">動画の作成（送信側）は <a href="https://f2sk.github.io/qr-file-receiver/send.html" style="color:#60a5fa">send.html</a>（PCのChrome/Edge）。</p>

  <script type="module">
    import { readBarcodes, prepareZXingModule } from "https://esm.sh/zxing-wasm@2.2.4/reader";
    // wasmの取得先を明示ピン（CDN間の版ずれ・解決失敗を避ける）
    prepareZXingModule({
      overrides: {
        locateFile: (path) =>
          path.endsWith(".wasm")
            ? "https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.4/dist/reader/zxing_reader.wasm"
            : path,
      },
    });

    // ===================================================================
    // shared/*.mjs からのインライン展開（単一HTML完結のため）。
    // ロジック変更時は shared/protocol.mjs / fountain.mjs / container.mjs と同期すること。
    // ===================================================================

    // ---- protocol ----
    const HEADER_LEN = 20;
    const MAGIC0 = 0xd1, MAGIC1 = 0x0c;
    function parseFrame(bytes) {
      if (bytes.length <= HEADER_LEN) return null;
      if (bytes[0] !== MAGIC0 || bytes[1] !== MAGIC1) return null;
      const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      const header = {
        sessionId: dv.getUint16(2, true),
        seq: dv.getUint32(4, true),
        k: dv.getUint16(8, true),
        blockLen: dv.getUint16(10, true),
        totalLen: dv.getUint32(12, true),
        payloadFnv: dv.getUint32(16, true),
      };
      if (header.k === 0 || header.blockLen === 0 || header.totalLen === 0) return null;
      if (bytes.length !== HEADER_LEN + header.blockLen) return null;
      return { header, block: bytes.subarray(HEADER_LEN) };
    }
    function fnv1a(bytes) {
      let h = 0x811c9dc5;
      for (let i = 0; i < bytes.length; i++) { h ^= bytes[i]; h = Math.imul(h, 0x01000193); }
      return h >>> 0;
    }
    function splitmix32(seed) {
      let s = seed | 0;
      return () => {
        s = (s + 0x9e3779b9) | 0;
        let t = s ^ (s >>> 16);
        t = Math.imul(t, 0x21f0aaad); t ^= t >>> 15;
        t = Math.imul(t, 0x735a2d97); t ^= t >>> 15;
        return t >>> 0;
      };
    }

    // ---- fountain (decoder side) ----
    const LN2 = 0.6931471805599453;
    function dlog(x) {
      let e = 0, m = x;
      while (m >= 1.5) { m /= 2; e++; }
      while (m < 0.75) { m *= 2; e--; }
      const z = (m - 1) / (m + 1), z2 = z * z;
      let term = z, sum = 0;
      for (let n = 1; n <= 21; n += 2) { sum += term / n; term *= z2; }
      return e * LN2 + 2 * sum;
    }
    const SOLITON_C = 0.1, SOLITON_DELTA = 0.5;
    function solitonCdf(k) {
      const cdf = new Float64Array(k);
      if (k === 1) { cdf[0] = 1; return cdf; }
      const R = Math.max(1, SOLITON_C * dlog(k / SOLITON_DELTA) * Math.sqrt(k));
      const spike = Math.min(k, Math.ceil(k / R));
      let total = 0;
      for (let d = 1; d <= k; d++) {
        const rho = d === 1 ? 1 / k : 1 / (d * (d - 1));
        let tau = 0;
        if (d < spike) tau = R / (d * k);
        else if (d === spike) tau = (R * Math.max(0, dlog(R / SOLITON_DELTA))) / k;
        total += rho + tau;
        cdf[d - 1] = total;
      }
      for (let i = 0; i < k; i++) cdf[i] = cdf[i] / total;
      cdf[k - 1] = 1;
      return cdf;
    }
    function frameSeed(sessionId, seq) {
      let h = (Math.imul(sessionId + 1, 0x9e3779b1) ^ (seq + 0x85ebca6b)) | 0;
      h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
      return (h ^ (h >>> 16)) | 0;
    }
    function frameIndices(k, cdf, sessionId, seq) {
      const rnd = splitmix32(frameSeed(sessionId, seq));
      const u = rnd() * 2 ** -32;
      let lo = 0, hi = k - 1;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (cdf[mid] >= u) hi = mid; else lo = mid + 1; }
      const d = Math.min(k, lo + 1);
      if (d > k >> 3) {
        const scratch = new Uint32Array(k);
        for (let i = 0; i < k; i++) scratch[i] = i;
        const out = new Array(d);
        for (let i = 0; i < d; i++) {
          const j = i + (rnd() % (k - i));
          const t = scratch[i]; scratch[i] = scratch[j]; scratch[j] = t;
          out[i] = scratch[i];
        }
        return out;
      }
      const set = new Set();
      while (set.size < d) set.add(rnd() % k);
      return [...set];
    }
    function xorInto(dst, src) { for (let i = 0; i < dst.length; i++) dst[i] = (dst[i] ^ src[i]) >>> 0; }

    class LTDecoder {
      constructor(k, blockLen, sessionId, totalLen) {
        this.k = k; this.blockLen = blockLen; this.sessionId = sessionId; this.totalLen = totalLen;
        this.words = Math.ceil(blockLen / 4);
        this.cdf = solitonCdf(k);
        this.solved = new Array(k).fill(null);
        this.byBlock = new Map();
        this.seen = new Set();
        this.solvedCount = 0; this.framesNew = 0; this.framesDup = 0;
      }
      get isComplete() { return this.solvedCount >= this.k; }
      addFrame(seq, block) {
        if (this.seen.has(seq)) { this.framesDup++; return; }
        this.seen.add(seq); this.framesNew++;
        if (this.isComplete) return;
        const idx = new Set(frameIndices(this.k, this.cdf, this.sessionId, seq));
        const words = new Uint32Array(this.words);
        new Uint8Array(words.buffer).set(block.subarray(0, this.blockLen));
        for (const b of [...idx]) {
          const s = this.solved[b];
          if (s) { xorInto(words, s); idx.delete(b); }
        }
        if (idx.size === 0) return;
        if (idx.size === 1) { this.resolve(idx.values().next().value, words); return; }
        const pf = { idx, words };
        for (const b of idx) {
          let set = this.byBlock.get(b);
          if (!set) { set = new Set(); this.byBlock.set(b, set); }
          set.add(pf);
        }
      }
      resolve(b0, w0) {
        const queue = [[b0, w0]];
        while (queue.length > 0) {
          const [b, w] = queue.pop();
          if (this.solved[b]) continue;
          this.solved[b] = w; this.solvedCount++;
          const waiting = this.byBlock.get(b);
          if (!waiting) continue;
          this.byBlock.delete(b);
          for (const pf of waiting) {
            xorInto(pf.words, w);
            pf.idx.delete(b);
            if (pf.idx.size === 1) {
              const r = pf.idx.values().next().value;
              this.byBlock.get(r)?.delete(pf);
              if (!this.solved[r]) queue.push([r, pf.words]);
            }
          }
        }
      }
      assemble() {
        if (!this.isComplete) return null;
        const out = new Uint8Array(this.totalLen);
        for (let b = 0; b < this.k; b++) {
          const start = b * this.blockLen;
          const len = Math.min(this.blockLen, this.totalLen - start);
          if (len > 0) out.set(new Uint8Array(this.solved[b].buffer, 0, len), start);
        }
        return out;
      }
    }

    // ---- container ----
    function unwrapFile(container) {
      if (container.length < 3) return null;
      const dv = new DataView(container.buffer, container.byteOffset, container.byteLength);
      if (dv.getUint8(0) !== 1) return null;
      const nameLen = dv.getUint16(1, true);
      if (container.length < 3 + nameLen) return null;
      const name = new TextDecoder().decode(container.subarray(3, 3 + nameLen));
      const bytes = container.subarray(3 + nameLen);
      return { name, bytes };
    }

    // ===================================================================
    // アプリ本体
    // ===================================================================
    const video = document.getElementById("video");
    const canvas = document.getElementById("work");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const indicator = document.getElementById("indicator");
    const statusEl = document.getElementById("status");
    const barFill = document.getElementById("barFill");
    const metaEl = document.getElementById("meta");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const resetBtn = document.getElementById("resetBtn");
    const saveBtn = document.getElementById("saveBtn");

    let stream = null, scanning = false, busy = false;
    let dec = null;
    let result = null; // { name, bytes }

    const setStatus = (m) => { statusEl.textContent = m; };
    function blink() {
      indicator.classList.add("blink");
      clearTimeout(blink._t);
      blink._t = setTimeout(() => indicator.classList.remove("blink"), 120);
    }
    function updateProgress() {
      if (!dec) { barFill.style.width = "0"; metaEl.textContent = ""; return; }
      const needEst = Math.ceil(dec.k * 1.2);
      const pct = dec.isComplete ? 100 : Math.min(99, (dec.framesNew / needEst) * 100);
      barFill.style.width = pct.toFixed(1) + "%";
      metaEl.textContent =
        `フレーム収集 ${dec.framesNew} / 目安 ${needEst}　|　解読ブロック ${dec.solvedCount}/${dec.k}` +
        `　|　重複 ${dec.framesDup}　session ${dec.sessionId}`;
    }

    function onFrameBytes(bytes) {
      const parsed = parseFrame(bytes);
      if (!parsed) return;
      const { header: h, block } = parsed;
      blink();
      // 新規セッション（送信リスタート）なら受信をリセット
      if (!dec || dec.sessionId !== h.sessionId) {
        dec = new LTDecoder(h.k, h.blockLen, h.sessionId, h.totalLen);
        result = null;
        saveBtn.disabled = true;
      }
      if (dec.isComplete) return;
      dec.addFrame(h.seq, block);
      updateProgress();
      if (dec.isComplete) onComplete(h);
    }

    function onComplete(h) {
      const container = dec.assemble();
      if (fnv1a(container) !== h.payloadFnv) {
        setStatus("⚠ 復元完了だがFNV不一致（データ破損の可能性）");
        return;
      }
      const un = unwrapFile(container);
      if (!un) { setStatus("⚠ コンテナ解凍失敗"); return; }
      result = un;
      scanning = false;
      stopCamera();
      saveBtn.disabled = false;
      updateProgress();
      setStatus(`受信完了: ${un.name} (${(un.bytes.length / 1024).toFixed(1)} KB)。「保存」を押してください。`);
    }

    function saveFile() {
      if (!result) return;
      const blob = new Blob([result.bytes], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = result.name || "received_file.bin";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    async function scanOnce() {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return;
      canvas.width = vw; canvas.height = vh;
      ctx.drawImage(video, 0, 0, vw, vh);
      let img;
      try { img = ctx.getImageData(0, 0, vw, vh); } catch { return; }
      let results;
      try {
        results = await readBarcodes(img, { formats: ["QRCode"], tryHarder: true, maxNumberOfSymbols: 1 });
      } catch { return; }
      for (const r of results) {
        if (r.bytes && r.bytes.length) onFrameBytes(new Uint8Array(r.bytes));
      }
    }

    function loop() {
      if (!scanning) return;
      if (busy) { requestAnimationFrame(loop); return; }
      busy = true;
      scanOnce().finally(() => {
        busy = false;
        if (scanning) requestAnimationFrame(loop);
      });
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();
        scanning = true;
        startBtn.disabled = true; stopBtn.disabled = false;
        setStatus("スキャン中…");
        loop();
      } catch (e) {
        setStatus("カメラ起動失敗: " + (e && e.message ? e.message : e));
      }
    }
    function stopCamera() {
      scanning = false;
      if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
      video.srcObject = null;
      startBtn.disabled = false; stopBtn.disabled = true;
    }
    function reset() {
      stopCamera();
      dec = null; result = null;
      saveBtn.disabled = true;
      updateProgress();
      setStatus("リセット完了");
    }

    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);
    resetBtn.addEventListener("click", reset);
    saveBtn.addEventListener("click", saveFile);

    // zxing-wasm を事前ロード（初回デコードの遅延を避ける）
    (async () => {
      try {
        await readBarcodes(new ImageData(2, 2), { formats: ["QRCode"] });
      } catch { /* ウォームアップ失敗は無視 */ }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus("このブラウザはカメラAPIに非対応");
        startBtn.disabled = true;
      } else if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
        setStatus("HTTPSまたはlocalhostでのみカメラを利用できます");
      } else {
        setStatus("「スキャン開始」を押してカメラを起動");
      }
    })();
  </script>
</body>
</html>
