<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>QRファイル受信 v2</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 10px;
      background: #121212;
      color: #eee;
    }
    h1 { font-size: 1.1rem; margin: 0 0 8px; }
    .row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    button {
      padding: 8px 12px;
      font-size: 0.95rem;
      border-radius: 6px;
      border: 1px solid #555;
      background: #2a2a2a;
      color: #eee;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    button.success { background: #16a34a; border-color: #16a34a; color: #fff; }
    .cam-wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 0 0 10px;
    }
    #video {
      width: 100%;
      background: #000;
      border-radius: 8px;
      display: block;
    }
    #indicator {
      display: inline-block;
      width: 18px; height: 18px;
      background: #c33;
      border-radius: 4px;
      transition: background 80ms ease-out;
    }
    #indicator.blink { background: #4ade80; }
    #status { font-size: 0.9rem; }
    #engine { font-size: 0.75rem; color: #888; margin-left: auto; }
    #grid {
      position: absolute;
      inset: 0;
      padding: 4px;
      display: grid;
      grid-template-columns: repeat(50, 1fr);
      gap: 2px;
      align-content: start;
      pointer-events: none;
      overflow: hidden;
      border-radius: 8px;
    }
    #grid:empty { display: none; }
    .cell {
      aspect-ratio: 1 / 1;
      background: rgba(120, 120, 120, 0.22);
      font-size: 7px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.35);
      border-radius: 1px;
      overflow: hidden;
    }
    .cell.solved {
      background: rgba(34, 197, 94, 0.7);
      color: rgba(0, 50, 20, 0.85);
    }
    @media (max-width: 720px) {
      #grid { grid-template-columns: repeat(30, 1fr); }
      .cell { font-size: 6px; }
    }
    @media (max-width: 420px) {
      #grid { grid-template-columns: repeat(20, 1fr); }
      .cell { font-size: 0; }
    }
    canvas#work { display: none; }
    .hint { font-size: 0.8rem; color: #999; margin-top: 6px; }
    .stats { font-size: 0.85rem; color: #ccc; }
  </style>
</head>
<body>
  <h1>QRファイル受信 v2 (ファウンテン符号化)</h1>

  <div class="row">
    <button id="startBtn" class="primary">スキャン開始</button>
    <button id="stopBtn" disabled>停止</button>
    <button id="resetBtn">リセット</button>
    <button id="saveBtn" class="success" disabled>保存</button>
  </div>

  <div class="row">
    <span id="indicator" aria-label="認識インジケーター"></span>
    <span id="status">準備中</span>
    <span id="engine"></span>
  </div>

  <div class="cam-wrap">
    <video id="video" playsinline muted autoplay></video>
    <div id="grid"></div>
  </div>
  <canvas id="work"></canvas>
  <div class="stats" id="stats"></div>
  <p class="hint">QR動画をカメラに向けてください。全ソースブロックが解けた時点で「保存」が有効になります。</p>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
  (() => {
    'use strict';

    const PROTOCOL_VERSION = 'v2';
    const DEGREE_TABLE = [
      [2, 0.50],
      [3, 0.30],
      [5, 0.15],
      [8, 0.05],
    ];

    // ===== PRNG (Python実装と同一の系列を生成) =====
    function xorshift32(state) {
      state ^= state << 13;
      state ^= state >>> 17;
      state ^= state << 5;
      return state >>> 0;
    }

    function deriveSeed(packetId) {
      const s = (packetId + 0x9E3779B9) >>> 0;
      return s !== 0 ? s : 0x12345678;
    }

    function sampleDegree(state) {
      state = xorshift32(state);
      const r = state / 0xFFFFFFFF;
      let cum = 0;
      for (const [d, p] of DEGREE_TABLE) {
        cum += p;
        if (r < cum) return [d, state];
      }
      return [DEGREE_TABLE[DEGREE_TABLE.length - 1][0], state];
    }

    function sampleIndices(state, n, degree) {
      const selected = [];
      const seen = new Set();
      const deg = Math.min(degree, n);
      while (selected.length < deg) {
        state = xorshift32(state);
        const idx = state % n;
        if (!seen.has(idx)) {
          seen.add(idx);
          selected.push(idx);
        }
      }
      return [selected, state];
    }

    function derivePacketIndices(packetId, n) {
      if (packetId < n) return [packetId];
      let state = deriveSeed(packetId);
      let degree;
      [degree, state] = sampleDegree(state);
      const [indices, _] = sampleIndices(state, n, degree);
      return indices;
    }

    // ===== Fountain decoder (GF(2) Gauss-Jordan, online RREF) =====
    class FountainDecoder {
      constructor(n, chunkSize) {
        this.n = n;
        this.chunkSize = chunkSize;
        this.maskBytes = (n + 7) >> 3;
        this.pivots = new Array(n).fill(null);
        this.packetsSeen = 0;
        this.duplicates = 0;
      }
      _makeMask(indices) {
        const m = new Uint8Array(this.maskBytes);
        for (const i of indices) m[i >> 3] |= (1 << (i & 7));
        return m;
      }
      _bit(mask, i) { return (mask[i >> 3] >> (i & 7)) & 1; }
      _popcount(mask) {
        let n = 0;
        for (let bi = 0; bi < mask.length; bi++) {
          let v = mask[bi];
          while (v) { n += v & 1; v >>>= 1; }
        }
        return n;
      }
      _firstSetBit(mask) {
        for (let bi = 0; bi < this.maskBytes; bi++) {
          const b = mask[bi];
          if (b) {
            for (let i = 0; i < 8; i++) {
              if (b & (1 << i)) {
                const col = (bi << 3) | i;
                return col < this.n ? col : -1;
              }
            }
          }
        }
        return -1;
      }
      _xorInto(dest, src) {
        for (let i = 0; i < dest.length; i++) dest[i] ^= src[i];
      }
      addPacket(indices, payloadBytes) {
        this.packetsSeen++;
        const mask = this._makeMask(indices);
        const payload = new Uint8Array(payloadBytes);
        const affected = new Set();

        // 既存pivotで完全に簡約
        for (let c = 0; c < this.n; c++) {
          if (this.pivots[c] !== null && this._bit(mask, c) === 1) {
            this._xorInto(mask, this.pivots[c].mask);
            this._xorInto(payload, this.pivots[c].payload);
          }
        }

        const newCol = this._firstSetBit(mask);
        if (newCol < 0) {
          this.duplicates++;
          return affected;
        }

        // 既存pivot から new_col 列を消去（RREF維持）
        for (let c = 0; c < this.n; c++) {
          if (c !== newCol && this.pivots[c] !== null && this._bit(this.pivots[c].mask, newCol) === 1) {
            this._xorInto(this.pivots[c].mask, mask);
            this._xorInto(this.pivots[c].payload, payload);
            affected.add(c);
          }
        }
        this.pivots[newCol] = { mask, payload };
        affected.add(newCol);
        return affected;
      }
      isSolvedBlock(col) {
        const p = this.pivots[col];
        if (!p) return false;
        return this._popcount(p.mask) === 1 && this._bit(p.mask, col) === 1;
      }
      solvedBlocks() {
        let n = 0;
        for (let i = 0; i < this.n; i++) if (this.isSolvedBlock(i)) n++;
        return n;
      }
      rank() {
        let n = 0;
        for (const p of this.pivots) if (p) n++;
        return n;
      }
      complete() { return this.solvedBlocks() === this.n; }
      assemble(totalLen) {
        const buf = new Uint8Array(this.n * this.chunkSize);
        for (let i = 0; i < this.n; i++) {
          buf.set(this.pivots[i].payload, i * this.chunkSize);
        }
        return buf.slice(0, totalLen);
      }
    }

    // ===== Payload parser =====
    function base64ToBytes(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    function parsePayload(text) {
      if (!text.startsWith(PROTOCOL_VERSION + '|')) return null;
      // split into 6 parts: v2 | pid | N | total_len | filename_enc | b64
      const parts = [];
      let prev = 0;
      for (let k = 0; k < 5; k++) {
        const next = text.indexOf('|', prev);
        if (next < 0) return null;
        parts.push(text.slice(prev, next));
        prev = next + 1;
      }
      parts.push(text.slice(prev));
      if (parts.length !== 6) return null;
      const [_, pidS, nS, tlS, fnEnc, b64] = parts;
      const packetId = parseInt(pidS, 10);
      const n = parseInt(nS, 10);
      const totalLen = parseInt(tlS, 10);
      if (!Number.isFinite(packetId) || !Number.isFinite(n) || !Number.isFinite(totalLen)) return null;
      let filename;
      try { filename = decodeURIComponent(fnEnc); } catch (e) { return null; }
      let payload;
      try { payload = base64ToBytes(b64); } catch (e) { return null; }
      return { packetId, n, totalLen, filename, payload };
    }

    // ===== UI / scanning =====
    const video = document.getElementById('video');
    const canvas = document.getElementById('work');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const indicator = document.getElementById('indicator');
    const statusEl = document.getElementById('status');
    const engineEl = document.getElementById('engine');
    const statsEl = document.getElementById('stats');
    const grid = document.getElementById('grid');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resetBtn = document.getElementById('resetBtn');
    const saveBtn = document.getElementById('saveBtn');

    let stream = null;
    let detector = null;
    let useNative = false;
    let scanning = false;
    let rafId = null;

    let decoder = null;
    let meta = { n: null, totalLen: null, filename: null };
    let seenPacketIds = new Set();
    let cells = [];

    const setStatus = (msg) => { statusEl.textContent = msg; };
    const setStats = (msg) => { statsEl.textContent = msg; };

    function blinkIndicator() {
      indicator.classList.add('blink');
      clearTimeout(blinkIndicator._t);
      blinkIndicator._t = setTimeout(() => indicator.classList.remove('blink'), 120);
    }

    function buildGrid(n) {
      grid.innerHTML = '';
      cells = new Array(n);
      const frag = document.createDocumentFragment();
      for (let i = 0; i < n; i++) {
        const div = document.createElement('div');
        div.className = 'cell';
        div.textContent = i;
        frag.appendChild(div);
        cells[i] = div;
      }
      grid.appendChild(frag);
    }

    function refreshCells(affected) {
      if (!decoder) return;
      const list = affected ? [...affected] : [...Array(decoder.n).keys()];
      for (const i of list) {
        if (decoder.isSolvedBlock(i)) cells[i] && cells[i].classList.add('solved');
        else cells[i] && cells[i].classList.remove('solved');
      }
    }

    function refreshStats() {
      if (!decoder) {
        setStats('');
        return;
      }
      setStats(`packets=${decoder.packetsSeen} rank=${decoder.rank()}/${decoder.n} solved=${decoder.solvedBlocks()}/${decoder.n} (dup=${decoder.duplicates})`);
    }

    function processOne(text) {
      const info = parsePayload(text);
      if (!info) return false;

      if (decoder === null) {
        meta.n = info.n;
        meta.totalLen = info.totalLen;
        meta.filename = info.filename;
        decoder = new FountainDecoder(info.n, info.payload.length);
        buildGrid(info.n);
        setStatus(`受信開始: ${info.filename} (N=${info.n}, ${info.totalLen.toLocaleString()} bytes)`);
      } else if (info.n !== meta.n || info.totalLen !== meta.totalLen) {
        // 別ファイルの混入は無視
        return false;
      }

      blinkIndicator();
      if (seenPacketIds.has(info.packetId)) return true;
      seenPacketIds.add(info.packetId);

      if (info.payload.length !== decoder.chunkSize) return false;

      const indices = derivePacketIndices(info.packetId, info.n);
      const affected = decoder.addPacket(indices, info.payload);
      refreshCells(affected);
      refreshStats();

      if (decoder.complete()) onComplete();
      return true;
    }

    function onComplete() {
      scanning = false;
      stopCamera();
      saveBtn.disabled = false;
      setStatus(`受信完了 ${decoder.solvedBlocks()}/${decoder.n}。「保存」を押してください。`);
    }

    function saveFile() {
      if (!decoder || !decoder.complete()) return;
      const data = decoder.assemble(meta.totalLen);
      const blob = new Blob([data], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = meta.filename || 'received_file.bin';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    async function setupDetector() {
      detector = null;
      useNative = false;
      if ('BarcodeDetector' in window) {
        try {
          const formats = await window.BarcodeDetector.getSupportedFormats();
          if (formats.includes('qr_code')) {
            detector = new window.BarcodeDetector({ formats: ['qr_code'] });
            useNative = true;
          }
        } catch (e) { /* fall back */ }
      }
      engineEl.textContent = useNative ? '[BarcodeDetector]' : (typeof jsQR === 'function' ? '[jsQR]' : '[?]');
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        await setupDetector();

        if (!useNative && typeof jsQR !== 'function') {
          setStatus('QRデコーダの読み込みに失敗しました');
          stopCamera();
          return;
        }

        scanning = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        if (!decoder) setStatus('スキャン中…');
        scanLoop();
      } catch (e) {
        setStatus('カメラ起動失敗: ' + (e && e.message ? e.message : e));
      }
    }

    function stopCamera() {
      scanning = false;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    async function scanFrameNative() {
      try {
        const codes = await detector.detect(video);
        for (const c of codes) {
          if (c.rawValue) processOne(c.rawValue);
        }
      } catch (e) { /* transient */ }
    }

    function scanFrameJs() {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return;
      canvas.width = vw;
      canvas.height = vh;
      ctx.drawImage(video, 0, 0, vw, vh);
      let img;
      try { img = ctx.getImageData(0, 0, vw, vh); }
      catch (e) { return; }
      const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      if (code && code.data) processOne(code.data);
    }

    async function scanLoop() {
      if (!scanning) return;
      if (useNative) await scanFrameNative();
      else scanFrameJs();
      if (scanning) rafId = requestAnimationFrame(scanLoop);
    }

    function reset() {
      stopCamera();
      decoder = null;
      meta = { n: null, totalLen: null, filename: null };
      seenPacketIds = new Set();
      cells = [];
      grid.innerHTML = '';
      saveBtn.disabled = true;
      setStats('');
      setStatus('リセット完了');
    }

    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);
    resetBtn.addEventListener('click', reset);
    saveBtn.addEventListener('click', saveFile);

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('このブラウザはカメラAPIに対応していません');
      startBtn.disabled = true;
    } else if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      setStatus('HTTPSまたはlocalhostでのみカメラを利用できます');
    } else {
      setStatus('「スキャン開始」を押してカメラを起動');
    }
  })();
  </script>
</body>
</html>
